name = "kreier-maintenance-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Primary R2 storage bucket for the facility installation
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "maintenance-data"

[vars]
ENVIRONMENT = "production"
DEFAULT_FACILITY_ID = "FAC-DEMO-001"
